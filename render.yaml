services:
  - type: web
    name: freshcart
    runtime: image
    image:
      url: ghcr.io/23c132-sairathna/freshcart:latest
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/freshcart.db
      - key: PORT
        value: "8080"
